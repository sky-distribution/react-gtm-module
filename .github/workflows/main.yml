name: Publish

on:
  push:
    branches:
      - "**"
    paths-ignore:
      - "README.md"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    if: "!contains(github.event.head_commit.committer.name, 'github-actions[bot]')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Git checkout
        uses: actions/checkout@main
        with:
          persist-credentials: false

      - name: Run Trivy vulnerability scanner in repo mode
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "repo"
          ignore-unfixed: true
          format: "table"
          severity: "CRITICAL,HIGH"

      - name: Set up Node.js
        uses: actions/setup-node@main
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install Dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run -s build

  publish:
    if: "github.ref == 'refs/heads/main' && github.event_name == 'push' && !contains(github.event.head_commit.committer.name, 'github-actions[bot]')"
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    steps:
      - name: Git checkout
        uses: actions/checkout@main
        with:
          fetch-depth: 0

      - name: Git Identity
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Set up Node.js
        uses: actions/setup-node@main
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run -s build

      - name: Version Check
        id: version_check
        run: |
          CURRENT_VERSION=v$(npm run -s get-version)
          echo "CURRENT_VERSION=${CURRENT_VERSION}"
          echo "version_changed=false" >> "$GITHUB_OUTPUT"
          while true; do
            GET_API_URL="https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/tags/${CURRENT_VERSION}"
            http_status_code=$(curl -LI "$GET_API_URL" -o /dev/null -w '%{http_code}\n' -sS \
              -H "Authorization: token ${GITHUB_TOKEN}")
            if [ "$http_status_code" -eq "404" ] ; then
              echo "CURRENT_VERSION=${CURRENT_VERSION}" >> "$GITHUB_ENV"
              echo "CURRENT_VERSION=${CURRENT_VERSION}"
              exit 0
            fi
            if [ "$http_status_code" -ne "200" ] ; then
              echo "::error::GitHub API returned ${http_status_code} for ${GET_API_URL}"
              exit 1
            fi
            echo "version_changed=true" >> "$GITHUB_OUTPUT"
            CURRENT_VERSION=$(npm version --git-tag-version=false patch)
            echo "CURRENT_VERSION=${CURRENT_VERSION}"
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit
        if: steps.version_check.outputs.version_changed == 'true'
        run: |
          git add package.json package-lock.json
          git commit -m "${CURRENT_VERSION}"
          git push origin HEAD:${GITHUB_REF}

      - name: Tag
        run: |
          git tag "${CURRENT_VERSION}"
          git push origin --tags

      - name: Publish
        run: npm publish
        env:
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
